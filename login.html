<!DOCTYPE html>
<html lang="en">

<head>
    <title>PowerPuffCode</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('e.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #212529;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #ffffff;
            text-align: center;
            margin-top: 20px;
            padding: 10px;
        }

        .card {
            max-width: 20rem;
            margin: 20px auto;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card-body {
            text-align: center;
        }

        .modal-content {
            background-color: rgba(255, 255, 255, 0.9); /* Adjust the transparency here */
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px); /* Optional: Adds a blurred effect to the background */
        }

        .modal-header {
            text-align: center;
        }

        .modal-body {
            text-align: center;
        }

        .imgcontainer {
            text-align: center;
            margin-bottom: 12px;
        }

        img.avatar {
            width: 30%;
            border-radius: 50%;
        }

        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
        }

        input[type=text],
        input[type=password] {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            box-sizing: border-box;
            border-radius: 5px;
        }

        button {
            background-color: #000000;
            color: #ffffff;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            width: 100%;
            border-radius: 5px;
        }

        button:hover {
            opacity: 0.8;
        }

        label {
            color: #000000;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="q.jpg" class="card-img-top" alt="PowerPuff Code">
        <div class="card-body">
            <h5 class="card-title">PowerPuff Code</h5>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">
                Click Here to Login
            </button>
        </div>
    </div>

    <!-- The Modal -->
    <div class="modal fade" id="myModal">
        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">
                    <h2>Login</h2>
                </div>

                <!-- Modal Body -->
                <div class="modal-body">
                    <form action="/action_page.php" method="post">
                        <div class="imgcontainer">
                            <img src="q.jpg" alt="Avatar" class="avatar">
                        </div>

                        <div class="container">
                            <label for="username">User Name:</label>
                            <input type="text" name="username" id="username" required>

                            <label for="password">Password:</label>
                            <input type="password" name="password" id="password" required>

                            <button type="button" class="btn btn-primary" onclick="validateForm()">Login</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function validateForm() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            if (username === "ico" && password === "kaishin") {
                alert("Login successful");
                window.location = "index.html";
            } else {
                alert("Username or Password is incorrect");
            }
        }
    </script>
</body>

</html>
